<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
</head>

<body>

    <center>
        <h1>🌟 Dream Career Application Form 🌟</h1>
        <p>Fill out this form to share your dream profession!</p>
    </center>

    <hr>

    <form action="http://idealist.org/en/careers/designing-your-dream-career" method="post">

        <h3>Personal Information</h3>

        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Age:</label><br>
        <input type="number">
        <br><br>

        <label>Email Address:</label><br>
        <input type="email" placeholder="example@gmail.com">
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <hr>

        <h3>Career Choice</h3>

        <label>Select Your Dream Career:</label><br>
        <select>
            <option>Doctor</option>
            <option>Engineer</option>
            <option>Artist</option>
            <option>Teacher</option>
            <option>Business Owner</option>
            <option>Software Developer</option>
        </select>
        <br><br>

        <label>Skills You Want to Learn:</label><br>
        <input type="checkbox"> Leadership <br>
        <input type="checkbox"> Communication <br>
        <input type="checkbox"> Coding <br>
        <input type="checkbox"> Creativity
        <br><br>

        <label>Why is this your dream career?</label><br>
        <textarea rows="5" cols="40" placeholder="Write here..."></textarea>
        <br><br>

        <label>Preferred Working Time:</label><br>
        <input type="date">
        <br><br>

        <label>Upload Your Resume:</label><br>
        <input type="file">
        <br><br>

        <label>Upload Profile Picture:</label><br>
        <input type="file">
        <br><br>

        <hr>

        <center>
            <input type="submit" value="Submit Form">
            <input type="reset" value="Clear Form">
        </center>

    </form>
</body>

</html>
