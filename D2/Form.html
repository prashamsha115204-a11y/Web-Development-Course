<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My first Form </title>
</head>

<body>
    <h2> Login Form </h2> <br>
    <form action="https://www.canva.com/ai-image-generator/" method="post">
        <label> Username: </label>
        <input type="text" placeholder="Enter Username"> <br> <br>

        <label> Password: </label>
        <input type="password" placeholder=" Enter password"> <br><br>

        <input type="submit" value="login"> <br><br>
    </form>
    <hr>

    <h2> Signup Form </h2> <br>
    <form action="https://www.canva.com/ai-image-generator/" method="post">
        <label> Full Name: </label>
        <input type="text" placeholder="Enter full name "> <br> <br>

        <label> Email: </label>
        <input type="email" placeholder="Enter email"> <br> <br>

        <label> Gender: </label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

        <label> Permanent Address: </label>
        <input type="text" placeholder="Enter your permanent address"> <br> <br>

        <label> Temporary Address: </label>
        <input type="text" placeholder="Enter your temporary address"> <br><br>

        <label> Country: </label>
        <select name="Country">
            <option>Nepal</option>
            <option>India</option>
            <option>China</option>
        </select> <br> <br>
    </form>
    <hr>

    <h2> Inquiry Form </h2>
    <form action="https://www.canva.com/ai-image-generator/" method="post">
        <label"> Name: </label>
            <input type="text" placeholder="Enter name"> <br> <br>

            <label> Email: </label>
            <input type="text" placeholder="Enter email"> <br> <br>

            <label> Message: </label>
            <textarea rows="5" cols="30" placeholder="Write inquiry here"></textarea><br><br>

            <input type="submit" value="Submit Inquiry">
    </form>

</body>

</html>
